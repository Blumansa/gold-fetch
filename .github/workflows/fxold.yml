name: fxold
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        sym: [GBPJPY, USDJPY]
        year: [2010,2011,2012,2013,2014,2015]
        half: [1,2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pandas pyarrow
      - run: python m1fx.py ${{ matrix.sym }} ${{ matrix.year }} ${{ matrix.half }}
      - uses: actions/upload-artifact@v4
        with: {name: "old-${{ matrix.sym }}-${{ matrix.year }}-${{ matrix.half }}", path: m1_*.parquet}
